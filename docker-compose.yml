version: '3.8'

services:
  # =========================================================================
  # 1. Node.js Backend Application
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_backend_app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://${DB_USER:-root}:${DB_PASSWORD:-root}@mysql_db:3306/${DB_NAME:-auth_db}
      - REDIS_URL=redis://valkey_cache:6379 # Возвращено точное имя переменной из вашего кода!
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRES_IN=${ACCESS_TOKEN_EXPIRES_IN}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-10}
      - MAX_LOGIN_ATTEMPTS=${MAX_LOGIN_ATTEMPTS:-5}
      - LOGIN_BLOCK_DURATION=${LOGIN_BLOCK_DURATION:-15}
    depends_on:
      mysql_db:
        condition: service_healthy
      valkey_cache:
        condition: service_healthy

  # =========================================================================
  # 2. Database Server (MySQL)
  # =========================================================================
  mysql_db:
    image: mysql:8.0
    container_name: auth_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-auth_db}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 3. In-Memory Cache Server (Valkey / Redis)
  # =========================================================================
  valkey_cache:
    image: valkey/valkey:7.2-alpine
    container_name: auth_valkey_cache
    restart: always
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  valkey_data:
